name: CI

on:
  pull_request:
    paths-ignore:
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.html"
      - "**.csv"
    branches-ignore:
      - version-**-beta
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
env:
    MARLEY_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
  group: develop-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}

    strategy:
      fail-fast: false

      matrix:
        container: [1]

    name: Server Tests

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.inputs.branch }}

      - name: Run Tests
        run: cd ~/frappe-bench/ && bench --site test_site run-parallel-tests --lightmode --app healthcare --total-builds ${{ strategy.job-total }} --build-number ${{ matrix.container }}
        env:
          TYPE: server
          CAPTURE_COVERAGE: ${{ github.event_name != 'pull_request' }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: coverage-${{ matrix.container }}
          path: /home/runner/frappe-bench/sites/coverage.xml

  coverage:
    name: Coverage Wrap Up
    needs: tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  undefined-names:
    # UNDEFINED-NAME GATE (logging audit G18, 2026-09-13). Narrow on purpose:
    # E9 (syntax / IO errors), F63 (comparisons that never hold), F7
    # (statement misuse, F722 included), F82 + F821 (undefined names).
    # Deliberately NOT this repo's full ruff config: gating on that is red on
    # arrival over import-order and unused-noqa trivia, and a check that is
    # always red teaches people to merge past it. This selection is the one
    # that earned its place — it is what caught
    # `posawesome.set_batch_nos_for_bundels`, a `safe_log` call whose import
    # never came with it, and a guest endpoint calling a `validate_token` that
    # no longer exists: live NameErrors no test reached.
    #
    # per-file-ignores is limited to DocType controllers AND to the two codes
    # frappe's GENERATED type block produces. ruff does not resolve
    # `frappe.types.DF.Literal` to `typing.Literal`, so it reads every option
    # string as a forward annotation: a bare word becomes F821, a phrase with
    # a space becomes F722. There are 3 such hits here (3 F821; no F722 today,
    # but the generator writes that shape for any option containing a space).
    # Every one of them sits between `# begin: auto-generated types` and `#
    # end: auto-generated types`, and there are ZERO real undefined names
    # outside those markers (measured 2026-09-13). Outside DocType controllers
    # both codes still fail the build, which is the whole point of keeping the
    # ignore path-scoped.
    name: Undefined names (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        # Pinned: a floating ruff turns a new rule or a parser change into
        # a surprise failure on an unrelated pull request.
        run: python -m pip install ruff==0.14.14

      - name: Check for undefined names
        # --isolated so the gate keeps meaning the same thing whatever a
        # later edit does to [tool.ruff] in pyproject; --no-cache because
        # a warm ruff cache buys nothing on a single-shot runner. The two
        # --per-file-ignores are not one comma-joined value on purpose:
        # ruff's CLI takes exactly one <pattern>:<code> per flag and
        # rejects the pair (measured with ruff 0.14.14).
        run: |
          python -m ruff check --no-cache --isolated \
            --select E9,F63,F7,F82,F821 \
            --per-file-ignores '**/doctype/**/*.py:F821' \
            --per-file-ignores '**/doctype/**/*.py:F722' \
            healthcare
